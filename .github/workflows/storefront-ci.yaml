name: storefront service ci

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      ORG_REPO: devops-teamk23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: storefront
      - name: Run Build
        run: npm run build
        working-directory: storefront
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/yas-storefront:${{ inputs.tag }}
